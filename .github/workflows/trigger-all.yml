name: Trigger All Workflows

on:
  schedule:
    - cron: '*/5 * * * *'   # هر ۵ دقیقه
  workflow_dispatch:        # اجرای دستی

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List all workflows (excluding itself)
        id: list-workflows
        run: |
          CURRENT_WORKFLOW_PATH=$(echo "${{ github.workflow_ref }}" | \
            sed -e "s#^${{ github.repository }}/##" -e 's#@.*##')
          echo "🔍 Current workflow path: $CURRENT_WORKFLOW_PATH"

          RESPONSE=$(curl -s -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows" \
            -o workflows.json)
          HTTP_CODE="${RESPONSE: -3}"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Failed to fetch workflows (HTTP $HTTP_CODE)"
            exit 1
          fi

          jq -r --arg current "$CURRENT_WORKFLOW_PATH" \
            '.workflows[] | select(.state == "active" and .path != $current) | .path' \
            workflows.json > workflow-paths.txt

          COUNT=$(wc -l < workflow-paths.txt)
          echo "📊 Found $COUNT other active workflow(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No other workflows to trigger. Exiting gracefully."
            exit 0
          fi
          echo "📋 Workflow paths to trigger:"
          cat workflow-paths.txt

      - name: Trigger each workflow with retry & rate-limit handling
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          TOTAL_COUNT=0

          trigger_with_retry() {
            local workflow_path="$1"
            local encoded_path=$(echo -n "$workflow_path" | jq -sRr @uri)
            local max_attempts=5
            local attempt=1
            local wait_time=2

            while [ $attempt -le $max_attempts ]; do
              echo "🔄 Attempt $attempt for $workflow_path"
              response=$(curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                -w "%{http_code}\n%{header_json}" \
                -d "{\"ref\":\"$DEFAULT_BRANCH\"}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$encoded_path/dispatches" \
                -o /dev/null)

              http_code=$(echo "$response" | head -n1)
              headers=$(echo "$response" | tail -n+2)

              if [ "$http_code" -eq 204 ]; then
                echo "✅ Successfully triggered $workflow_path"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                return 0
              fi

              reset_time=$(echo "$headers" | jq -r '.["x-ratelimit-reset"]' 2>/dev/null)
              remaining=$(echo "$headers" | jq -r '.["x-ratelimit-remaining"]' 2>/dev/null)

              if [ "$remaining" = "0" ] && [ -n "$reset_time" ]; then
                current_time=$(date +%s)
                sleep_seconds=$((reset_time - current_time + 2))
                if [ $sleep_seconds -gt 0 ]; then
                  echo "⏳ Rate limit reached. Sleeping for $sleep_seconds seconds..."
                  sleep $sleep_seconds
                fi
                continue
              fi

              if [ "$http_code" -ge 500 ] || [ "$http_code" -eq 404 ]; then
                echo "⚠️ HTTP $http_code for $workflow_path. Retrying in $wait_time seconds..."
                sleep $wait_time
                wait_time=$((wait_time * 2))
                attempt=$((attempt + 1))
              else
                echo "❌ Unrecoverable error (HTTP $http_code) for $workflow_path"
                FAIL_COUNT=$((FAIL_COUNT + 1))
                return 1
              fi
            done

            echo "❌ Failed after $max_attempts attempts for $workflow_path"
            FAIL_COUNT=$((FAIL_COUNT + 1))
            return 1
          }

          while IFS= read -r workflow_path; do
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            trigger_with_retry "$workflow_path"
          done < workflow-paths.txt

          echo "============================"
          echo "📊 Summary:"
          echo "   Total workflows attempted: $TOTAL_COUNT"
          echo "   ✅ Successful: $SUCCESS_COUNT"
          echo "   ❌ Failed: $FAIL_COUNT"
          echo "============================"

          if [ $FAIL_COUNT -gt 0 ]; then
            echo "❌ Some workflows failed to trigger."
            exit 1
          else
            echo "✅ All workflows triggered successfully!"
          fi
