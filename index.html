<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SlipNet Cyber Command · THE SAZ</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ============================================================
           CYBERPUNK VARIABLES
           ============================================================ */
        :root {
            --bg-primary: #020204;
            --bg-secondary: #0a0a10;
            --bg-card: #101018;
            --bg-input: #151520;
            --bg-hover: #1c1c2a;
            --text-primary: #e0e0ff;
            --text-secondary: #00f0ff;
            --text-muted: #4a5568;
            --border-color: rgba(0, 240, 255, 0.25);
            
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --neon-purple: #b026ff;
            --neon-green: #00ff41;
            --neon-yellow: #ffe600;
            
            --accent: var(--neon-cyan);
            --font-family: 'Vazirmatn', monospace, sans-serif;
        }

        /* ============================================================
           BASE & SCANLINES (CRT EFFECT)
           ============================================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            min-height: 100vh;
            direction: ltr;
            overflow-x: hidden;
            position: relative;
        }

        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 1500px; margin: 0 auto; padding: 20px;
            position: relative; z-index: 10;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }

        /* ============================================================
           ANIMATIONS & GLITCH FX
           ============================================================ */
        @keyframes cyber-slide-in {
            from { opacity: 0; transform: translateX(-20px) scale(0.98); filter: blur(4px); }
            to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px var(--accent); }
            50% { box-shadow: 0 0 25px var(--accent), 0 0 10px var(--accent) inset; }
        }
        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(-2px, 2px); }
        }

        .glitch { position: relative; display: inline-block; }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 var(--neon-pink);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 var(--neon-cyan);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        /* ============================================================
           BUTTONS & INPUTS
           ============================================================ */
        button, select, input {
            font-family: var(--font-family);
            background: var(--bg-input); color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px; outline: none; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        input:focus, select:focus { border-color: var(--accent); background: var(--bg-hover); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        input[type="text"] { width: 100%; max-width: 300px; }

        /* ============================================================
           HEADER & HUD
           ============================================================ */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .brand h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: var(--text-primary); }
        .brand h1 span { color: var(--accent); }
        
        .hud-stats {
            display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;
        }
        .hud-box {
            background: var(--bg-card); border-left: 4px solid var(--accent);
            padding: 15px 20px; flex: 1; min-width: 200px;
            position: relative; overflow: hidden;
        }
        .hud-box::after { content:''; position:absolute; right:-20px; bottom:-20px; font-size:5rem; opacity:0.05; font-family:"Font Awesome 5 Free"; font-weight:900; }
        .hud-box.total::after { content: '\f233'; }
        .hud-box.online::after { content: '\f058'; }
        .hud-box.offline::after { content: '\f057'; }
        
        .hud-box .title { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; }
        .hud-box .val { font-size: 2rem; font-weight: 900; color: var(--text-primary); text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .hud-box.online { border-color: var(--neon-green); }
        .hud-box.online .val { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }
        .hud-box.offline { border-color: var(--neon-pink); }
        .hud-box.offline .val { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* Visual Progress Bar */
        .hud-progress-wrap { width: 100%; height: 6px; background: #222; margin-top: 10px; display: flex; }
        .hud-bar-online { background: var(--neon-green); height: 100%; transition: width 0.5s; box-shadow: 0 0 10px var(--neon-green); }
        .hud-bar-offline { background: var(--neon-pink); height: 100%; transition: width 0.5s; box-shadow: 0 0 10px var(--neon-pink); }

        /* ============================================================
           TOOLBAYS & CONTROLS
           ============================================================ */
        .cyber-toolbar {
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
            background: rgba(0, 240, 255, 0.05); padding: 15px;
            border: 1px solid var(--border-color); margin-bottom: 20px;
        }
        .cyber-toolbar .group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .cyber-toolbar .divider { width: 2px; height: 30px; background: var(--border-color); margin: 0 10px; }

        .export-btn { background: transparent; border-color: var(--neon-purple); color: var(--neon-purple); }
        .export-btn:hover { background: var(--neon-purple); color: #000; box-shadow: 0 0 15px var(--neon-purple); }

        /* ============================================================
           TABLE DESIGN
           ============================================================ */
        .table-wrap { overflow-x: auto; border: 1px solid var(--border-color); background: var(--bg-secondary); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background: rgba(0, 240, 255, 0.15); color: var(--accent);
            padding: 15px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 2px solid var(--accent); cursor: pointer;
        }
        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        /* Table Row Animations */
        tbody tr {
            opacity: 0;
            animation: cyber-slide-in 0.4s ease-out forwards;
            transition: background 0.2s, box-shadow 0.2s;
        }
        tbody tr:hover {
            background: var(--bg-hover);
            box-shadow: inset 4px 0 0 var(--accent);
        }

        /* Status Badges */
        .badge { padding: 4px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 2px; }
        .badge-valid { background: rgba(0, 255, 65, 0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .badge-invalid { background: rgba(255, 0, 85, 0.1); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
        .badge-pending { background: rgba(255, 230, 0, 0.1); color: var(--neon-yellow); border: 1px solid var(--neon-yellow); }
        .badge-proto { background: rgba(176, 38, 255, 0.1); color: var(--neon-purple); border: 1px solid var(--neon-purple); }

        .link-cell a { color: var(--text-primary); text-decoration: none; font-family: monospace; letter-spacing: 0.5px; }
        .link-cell a:hover { color: var(--accent); text-decoration: underline; text-shadow: 0 0 8px var(--accent); }

        /* Ping/Latency Column */
        .latency-val { font-family: monospace; color: var(--text-muted); font-size: 0.85rem; }
        .latency-val.fast { color: var(--neon-green); }
        .latency-val.mid { color: var(--neon-yellow); }
        .latency-val.slow { color: var(--neon-pink); }

        /* Row Details (Expandable) */
        .row-details {
            background: rgba(0,0,0,0.5); padding: 15px; margin-top: 10px;
            border-left: 2px dashed var(--accent); display: none;
            font-family: monospace; color: var(--neon-cyan); font-size: 0.85rem;
        }
        .row-details.open { display: block; animation: cyber-slide-in 0.3s forwards; }

        /* ============================================================
           TACTICAL PAGINATION (پارت بندی)
           ============================================================ */
        .tactical-pagination {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); padding: 15px; border: 1px solid var(--border-color);
            margin-top: 20px; flex-wrap: wrap; gap: 15px;
        }
        .page-info { color: var(--accent); font-weight: bold; }
        .page-controls { display: flex; gap: 5px; }
        .page-controls button { padding: 8px 12px; min-width: 40px; }
        .page-controls button.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        .page-controls button:disabled { opacity: 0.3; cursor: not-allowed; }

        .page-size-selector { display: flex; align-items: center; gap: 10px; }
        .page-size-selector select { padding: 6px 10px; }

        /* ============================================================
           TOAST
           ============================================================ */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--bg-input); border-bottom: 3px solid var(--accent);
            padding: 15px 30px; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 9999;
            display: none; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">
                <h1 class="glitch" data-text="SLIPNET COMMAND">SLIPNET <span>COMMAND</span></h1>
                <div style="color:var(--text-muted); font-family:monospace; margin-top:5px;">SYS.VER: 2.0.1 // PROTOCOL: SAZ🏴‍☠️</div>
            </div>
            <button id="refreshBtn" style="animation: pulse-glow 2s infinite;"><i class="fas fa-sync-alt"></i> SYNC_DATA</button>
        </header>

        <div class="hud-stats">
            <div class="hud-box total">
                <div class="title">TOTAL NODES</div>
                <div class="val" id="hudTotal">0</div>
            </div>
            <div class="hud-box online">
                <div class="title">ACTIVE / ONLINE</div>
                <div class="val" id="hudOnline">0</div>
                <div class="hud-progress-wrap">
                    <div class="hud-bar-online" id="barOnline" style="width:0%;"></div>
                    <div class="hud-bar-offline" id="barOffline" style="width:0%;"></div>
                </div>
            </div>
            <div class="hud-box offline">
                <div class="title">DEAD / OFFLINE</div>
                <div class="val" id="hudOffline">0</div>
            </div>
        </div>

        <div class="cyber-toolbar">
            <div class="group" style="flex:1;">
                <input type="text" id="searchInput" placeholder="Scan Databanks (Search)..." />
                <select id="channelFilter"><option value="all">ALL CHANNELS</option></select>
                <select id="statusFilter">
                    <option value="all">ALL STATUS</option>
                    <option value="valid">ONLINE</option>
                    <option value="invalid">OFFLINE</option>
                    <option value="pending">PENDING</option>
                </select>
            </div>
            
            <div class="divider"></div>
            
            <div class="group">
                <button id="validateBtn" style="border-color:var(--neon-green); color:var(--neon-green);"><i class="fas fa-bolt"></i> FULL SCAN</button>
                <button id="copyAllBtn"><i class="fas fa-copy"></i> COPY ALL</button>
            </div>
            
            <div class="divider"></div>
            
            <div class="group">
                <span style="font-size:0.8rem; color:var(--text-muted);">EXPORT:</span>
                <button class="export-btn" onclick="exportData('json')">JSON</button>
                <button class="export-btn" onclick="exportData('csv')">CSV</button>
                <button class="export-btn" onclick="exportData('txt')">TXT</button>
            </div>
        </div>

        <div class="tactical-pagination" style="margin-bottom: -1px; border-bottom:none;">
            <div class="page-size-selector">
                <span>ROWS PER PAGE:</span>
                <select id="pageSizeTop">
                    <option value="10">10</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="all">MAX (ALL)</option>
                </select>
            </div>
            <div class="page-info">PAGE <span id="currentPageDisplayTop">1</span> OF <span id="totalPagesDisplayTop">1</span></div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-sort="channel">Channel <i class="fas fa-sort"></i></th>
                        <th data-sort="protocol">Proto <i class="fas fa-sort"></i></th>
                        <th data-sort="link">Encrypted Address <i class="fas fa-sort"></i></th>
                        <th data-sort="status">SYS_STATUS <i class="fas fa-sort"></i></th>
                        <th data-sort="ping">Ping <i class="fas fa-sort"></i></th>
                        <th>Terminal</th>
                    </tr>
                </thead>
                <tbody id="nodesBody">
                    </tbody>
            </table>
        </div>

        <div class="tactical-pagination">
            <div class="page-info" id="recordCountDisplay">SHOWING 0 TO 0 OF 0 ENTRIES</div>
            <div class="page-controls" id="paginationControls">
                </div>
        </div>

    </div>

    <div id="toast">SYSTEM MESSAGE</div>

    <script>
        (function() {
            'use strict';

            // --- CONFIG (DO NOT TOUCH CORE REPO LOGIC) ---
            const CONFIG = {
                repoOwner: 'its-thesaz',
                repoName: 'slipnet-collector',
                fileName: 'SAZ🏴‍☠️.TXT',
                get rawUrl() { return `https://raw.githubusercontent.com/${this.repoOwner}/${this.repoName}/main/${encodeURIComponent(this.fileName)}`; }
            };

            // --- STATE MANAGEMENT ---
            const state = {
                allNodes: [],
                filteredNodes: [],
                pageSize: 50,
                currentPage: 1,
                sortKey: 'channel',
                sortDir: 'asc'
            };

            // --- DOM Elements ---
            const dom = {
                nodesBody: document.getElementById('nodesBody'),
                hudTotal: document.getElementById('hudTotal'),
                hudOnline: document.getElementById('hudOnline'),
                hudOffline: document.getElementById('hudOffline'),
                barOnline: document.getElementById('barOnline'),
                barOffline: document.getElementById('barOffline'),
                channelFilter: document.getElementById('channelFilter'),
                statusFilter: document.getElementById('statusFilter'),
                searchInput: document.getElementById('searchInput'),
                toast: document.getElementById('toast'),
                pageSizeTop: document.getElementById('pageSizeTop'),
                currPageTop: document.getElementById('currentPageDisplayTop'),
                totalPageTop: document.getElementById('totalPagesDisplayTop'),
                recordCount: document.getElementById('recordCountDisplay'),
                pageControls: document.getElementById('paginationControls')
            };

            // --- UTILITIES ---
            function showToast(msg, color = 'var(--accent)') {
                dom.toast.textContent = msg;
                dom.toast.style.display = 'block';
                dom.toast.style.borderBottomColor = color;
                setTimeout(() => dom.toast.style.display = 'none', 3000);
            }

            function copyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('DATA COPIED TO CLIPBOARD', 'var(--neon-cyan)');
                }).catch(() => showToast('COPY FAILED', 'var(--neon-pink)'));
            }

            function validateLink(link) { return /^slipnet(?:-enc)?:\/\/[^\s<>"\'\[\]{}|\\^`]+$/i.test(link.trim()); }
            
            // Random Ping Generator for visual effect (10ms - 250ms)
            function getSimulatedPing() { return Math.floor(Math.random() * 240) + 10; }

            // --- CORE PARSER (UNTOUCHED LOGIC) ---
            function parseNodes(text) {
                const lines = text.split('\n');
                const nodes = [];
                let currentChannel = 'Unknown';
                const channelRegex = /┌─── ◆ (.+?) ◆ ─── \((\d+)/;
                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;
                    const match = channelRegex.exec(line);
                    if (match) { currentChannel = match[1].trim(); continue; }
                    let link = line.replace(/[│┃📡🔗]/g, '').trim();
                    if (link.startsWith('slipnet://') || link.startsWith('slipnet-enc://')) {
                        const proto = link.startsWith('slipnet-enc') ? 'ENC' : 'RAW';
                        nodes.push({ 
                            channel: currentChannel, 
                            link: link, 
                            status: 'pending', 
                            protocol: proto,
                            ping: 0 // Default
                        });
                    }
                }
                return nodes;
            }

            // --- RENDER & PAGINATION (TACTICAL UI) ---
            function renderTable() {
                const total = state.filteredNodes.length;
                let limit = state.pageSize === 'all' ? total : parseInt(state.pageSize);
                const totalPages = limit === 0 ? 1 : Math.ceil(total / limit);
                
                if (state.currentPage > totalPages) state.currentPage = totalPages || 1;
                
                const start = (state.currentPage - 1) * limit;
                const end = Math.min(start + limit, total);
                const pageNodes = state.filteredNodes.slice(start, end);

                dom.nodesBody.innerHTML = '';
                
                if (pageNodes.length === 0) {
                    dom.nodesBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; font-weight:bold; color:var(--neon-pink);">[ NO DATABANKS MATCH QUERY ]</td></tr>`;
                }

                // Staggered Entry Animation
                pageNodes.forEach((node, idx) => {
                    const realIdx = start + idx;
                    const tr = document.createElement('tr');
                    // Add delay based on index for the waterfall effect
                    tr.style.animationDelay = `${(idx % limit) * 0.03}s`;
                    
                    let statusClass = 'badge-pending';
                    if (node.status === 'valid') statusClass = 'badge-valid';
                    if (node.status === 'invalid') statusClass = 'badge-invalid';

                    let pingHtml = `<span class="latency-val">-- ms</span>`;
                    if (node.status !== 'pending') {
                        let pClass = node.ping < 80 ? 'fast' : (node.ping < 150 ? 'mid' : 'slow');
                        pingHtml = `<span class="latency-val ${pClass}">${node.ping} ms</span>`;
                    }

                    tr.innerHTML = `
                        <td>${node.channel}</td>
                        <td><span class="badge badge-proto">${node.protocol}</span></td>
                        <td class="link-cell">
                            <a href="${node.link}" target="_blank">${node.link.substring(0, 40)}...</a>
                            <button onclick="copyLink('${node.link}')" style="background:none; border:none; color:var(--accent); margin-left:10px;"><i class="fas fa-copy"></i></button>
                        </td>
                        <td><span class="badge ${statusClass}">${node.status.toUpperCase()}</span></td>
                        <td>${pingHtml}</td>
                        <td>
                            <button onclick="toggleDetails(${realIdx})" style="padding:4px 8px; font-size:0.75rem;">DETAILS</button>
                            <button onclick="validateSingle(${realIdx})" style="padding:4px 8px; font-size:0.75rem; border-color:var(--neon-yellow); color:var(--neon-yellow);">TEST</button>
                        </td>
                    `;
                    
                    // Row Details (Hidden by default)
                    const trDetails = document.createElement('tr');
                    trDetails.innerHTML = `
                        <td colspan="6" style="padding:0; border:none;">
                            <div class="row-details" id="details-${realIdx}">
                                > FULL_ADDR: ${node.link}<br>
                                > CHANNEL_ID: ${node.channel}<br>
                                > ENCRYPTION: ${node.protocol === 'ENC' ? 'Active' : 'None'}<br>
                                > BYTE_LENGTH: ${node.link.length} bytes
                            </div>
                        </td>
                    `;

                    dom.nodesBody.appendChild(tr);
                    dom.nodesBody.appendChild(trDetails);
                });

                updateHUD(state.filteredNodes);
                updatePaginationUI(total, limit, start, end, totalPages);
            }

            function updateHUD(nodes) {
                const total = nodes.length;
                const valid = nodes.filter(n => n.status === 'valid').length;
                const invalid = nodes.filter(n => n.status === 'invalid').length;
                
                dom.hudTotal.textContent = total;
                dom.hudOnline.textContent = valid;
                dom.hudOffline.textContent = invalid;

                if (total > 0) {
                    dom.barOnline.style.width = `${(valid / total) * 100}%`;
                    dom.barOffline.style.width = `${(invalid / total) * 100}%`;
                } else {
                    dom.barOnline.style.width = '0%';
                    dom.barOffline.style.width = '0%';
                }
            }

            function updatePaginationUI(total, limit, start, end, totalPages) {
                dom.currPageTop.textContent = state.currentPage;
                dom.totalPageTop.textContent = totalPages;
                dom.recordCount.textContent = `SHOWING ${total === 0 ? 0 : start + 1} TO ${end} OF ${total} ENTRIES`;

                let html = `
                    <button onclick="changePage(1)" ${state.currentPage === 1 ? 'disabled' : ''}><i class="fas fa-angle-double-left"></i></button>
                    <button onclick="changePage(${state.currentPage - 1})" ${state.currentPage === 1 ? 'disabled' : ''}><i class="fas fa-angle-left"></i></button>
                `;
                
                let startPage = Math.max(1, state.currentPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);
                
                for (let i = startPage; i <= endPage; i++) {
                    html += `<button onclick="changePage(${i})" class="${i === state.currentPage ? 'active' : ''}">${i}</button>`;
                }

                html += `
                    <button onclick="changePage(${state.currentPage + 1})" ${state.currentPage >= totalPages ? 'disabled' : ''}><i class="fas fa-angle-right"></i></button>
                    <button onclick="changePage(${totalPages})" ${state.currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-angle-double-right"></i></button>
                `;
                dom.pageControls.innerHTML = html;
            }

            window.changePage = function(page) {
                state.currentPage = page;
                renderTable();
            };

            window.copyLink = function(link) { copyToClipboard(link); };
            
            window.toggleDetails = function(idx) {
                const el = document.getElementById(`details-${idx}`);
                if(el.classList.contains('open')) el.classList.remove('open');
                else el.classList.add('open');
            };

            // --- FILTERING & SORTING ---
            function applyFilters() {
                const search = dom.searchInput.value.toLowerCase();
                const channel = dom.channelFilter.value;
                const status = dom.statusFilter.value;

                state.filteredNodes = state.allNodes.filter(n => 
                    n.link.toLowerCase().includes(search) &&
                    (channel === 'all' || n.channel === channel) &&
                    (status === 'all' || n.status === status)
                );
                
                state.filteredNodes.sort((a, b) => {
                    let va = a[state.sortKey] || '', vb = b[state.sortKey] || '';
                    if(state.sortKey === 'status') {
                        const order = {'valid':1, 'pending':2, 'invalid':3};
                        va = order[a.status] || 0; vb = order[b.status] || 0;
                    }
                    if (va < vb) return state.sortDir === 'asc' ? -1 : 1;
                    if (va > vb) return state.sortDir === 'asc' ? 1 : -1;
                    return 0;
                });
                
                state.currentPage = 1;
                renderTable();
            }

            // --- VALIDATION & SCANNING ---
            window.validateSingle = function(idx) {
                const node = state.filteredNodes[idx];
                if(node) {
                    node.status = validateLink(node.link) ? 'valid' : 'invalid';
                    node.ping = getSimulatedPing(); // Tactical visual ping
                    renderTable();
                }
            };

            async function validateAll() {
                showToast('INITIATING GLOBAL SCAN...', 'var(--neon-yellow)');
                const toValidate = state.filteredNodes.filter(n => n.status === 'pending');
                
                // Process in batches for visual "hacking" effect rather than instant
                let batchSize = 50;
                for (let i = 0; i < toValidate.length; i += batchSize) {
                    const batch = toValidate.slice(i, i + batchSize);
                    await new Promise(resolve => setTimeout(resolve, 100)); // Cyber delay
                    batch.forEach(node => {
                        node.status = validateLink(node.link) ? 'valid' : 'invalid';
                        node.ping = getSimulatedPing();
                    });
                    renderTable(); // Re-render per batch to see progress visually
                }
                showToast('SCAN COMPLETE', 'var(--neon-green)');
            }

            // --- EXPORT DATA (NEW CAPABILITY) ---
            window.exportData = function(format) {
                let dataStr = '';
                let fileName = `slipnet_dump_${new Date().getTime()}`;
                let mime = 'text/plain';

                if (format === 'json') {
                    dataStr = JSON.stringify(state.filteredNodes, null, 2);
                    fileName += '.json';
                    mime = 'application/json';
                } else if (format === 'csv') {
                    dataStr = 'Channel,Protocol,Status,Ping,Link\n';
                    state.filteredNodes.forEach(n => {
                        dataStr += `"${n.channel}","${n.protocol}","${n.status}","${n.ping}","${n.link}"\n`;
                    });
                    fileName += '.csv';
                    mime = 'text/csv';
                } else {
                    state.filteredNodes.forEach(n => {
                        dataStr += `[${n.channel}] ${n.status.toUpperCase()} -> ${n.link}\n`;
                    });
                    fileName += '.txt';
                }

                const blob = new Blob([dataStr], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`DATA EXPORTED AS ${format.toUpperCase()}`, 'var(--neon-purple)');
            };

            // --- FETCH DATA ---
            async function loadData() {
                showToast('FETCHING REPOSITORY DATA...', 'var(--neon-cyan)');
                try {
                    const resp = await fetch(CONFIG.rawUrl);
                    if (!resp.ok) throw new Error('Fetch Error');
                    const text = await resp.text();
                    
                    state.allNodes = parseNodes(text);
                    
                    // Extract unique channels for filter
                    const channels = [...new Set(state.allNodes.map(n => n.channel))];
                    dom.channelFilter.innerHTML = `<option value="all">ALL CHANNELS</option>`;
                    channels.forEach(ch => dom.channelFilter.insertAdjacentHTML('beforeend', `<option value="${ch}">${ch}</option>`));
                    
                    applyFilters();
                    showToast('SYSTEM READY. DATA LOADED.', 'var(--neon-green)');
                } catch (e) {
                    showToast('CRITICAL ERROR: DATA FETCH FAILED', 'var(--neon-pink)');
                }
            }

            // --- EVENT LISTENERS ---
            document.getElementById('refreshBtn').addEventListener('click', loadData);
            document.getElementById('validateBtn').addEventListener('click', validateAll);
            document.getElementById('copyAllBtn').addEventListener('click', () => {
                const txt = state.filteredNodes.map(n => n.link).join('\n');
                copyToClipboard(txt);
            });
            
            dom.searchInput.addEventListener('input', applyFilters);
            dom.channelFilter.addEventListener('change', applyFilters);
            dom.statusFilter.addEventListener('change', applyFilters);
            
            dom.pageSizeTop.addEventListener('change', (e) => {
                state.pageSize = e.target.value;
                state.currentPage = 1;
                renderTable();
            });

            // Table Sorting Listeners
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', function() {
                    const key = this.dataset.sort;
                    if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
                    else { state.sortKey = key; state.sortDir = 'asc'; }
                    applyFilters();
                });
            });

            // Init
            window.onload = loadData;

        })();
    </script>
</body>
</html>
